<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>GPA — Horas Extras</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
body{background:#f3f4f6;min-height:100vh}
.hidden{display:none!important}
/* LOGIN */
#loginScreen{min-height:100vh;background:#1e3a6e;display:flex;align-items:center;justify-content:center;padding:16px}
.login-box{background:#fff;border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,.3);padding:36px 32px;width:100%;max-width:380px}
.login-logo{width:120px;height:120px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center}
.login-logo svg{width:100%;height:100%}
.login-box h1{font-size:20px;color:#1e3a6e;font-weight:800;text-align:center}
.login-box .sub{font-size:13px;color:#9ca3af;text-align:center;margin-top:4px;margin-bottom:20px}
label{display:block;font-size:12px;color:#6b7280;margin-bottom:4px;margin-top:14px}
input,textarea,select{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:10px 14px;font-size:14px;outline:none;transition:border .2s;background:#fff}
input:focus,textarea:focus,select:focus{border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.2)}
.pass-wrap{position:relative}.pass-wrap input{padding-right:64px}
.toggle-pass{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:12px;color:#9ca3af}
.btn{width:100%;padding:12px;border-radius:12px;border:none;cursor:pointer;font-weight:700;font-size:14px;transition:background .2s,transform .1s}
.btn:active{transform:scale(.98)}
.btn-primary{background:#1e3a6e;color:#fff}.btn-primary:hover{background:#162d57}
.btn-primary:disabled{background:#d1d5db;cursor:not-allowed;transform:none}
.btn-green{background:#16a34a;color:#fff;padding:10px}.btn-green:hover{background:#15803d}
.btn-red{background:#ef4444;color:#fff;padding:10px}.btn-red:hover{background:#dc2626}
.btn-orange{background:#ea580c;color:#fff;padding:10px}
.btn-csv{background:#15803d;color:#fff;margin-bottom:12px}
.btn-sm{padding:8px 16px;width:auto;font-size:13px;border-radius:8px}
.btn-xs{padding:5px 10px;width:auto;font-size:12px;border-radius:6px;border:none;cursor:pointer;font-weight:600}
.err-msg{background:#fef2f2;color:#dc2626;border-radius:8px;padding:10px 14px;font-size:13px;margin-top:10px}
.hint{font-size:11px;color:#d1d5db;text-align:center;margin-top:14px}
/* APP */
#appScreen{display:none;flex-direction:column;min-height:100vh}
.app-header{background:#1e3a6e;color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.header-logo{width:40px;height:40px;margin-right:10px;flex-shrink:0}
.header-title{font-weight:800;font-size:15px}
.header-sub{font-size:11px;color:#93c5fd;margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.badge-op{background:#2563eb}.badge-jefe{background:#15803d}.badge-ger{background:#7c3aed}.badge-admin{background:#374151}
.clock-time{font-family:monospace;font-size:16px;font-weight:700;text-align:right}
.clock-date{font-size:11px;color:#93c5fd;text-align:right}
.btn-logout{background:transparent;border:1px solid #4b83c4;color:#93c5fd;padding:4px 10px;border-radius:8px;cursor:pointer;font-size:12px;margin-left:8px}
.btn-logout:hover{color:#fff}
.tabs{display:flex;background:#fff;border-bottom:1px solid #e5e7eb;overflow-x:auto}
.tab{flex:1;min-width:90px;padding:11px 6px;border:none;background:none;cursor:pointer;font-size:12px;font-weight:600;color:#6b7280;white-space:nowrap;border-bottom:2px solid transparent}
.tab.active{color:#1e3a6e;border-bottom-color:#1e3a6e;background:#eff6ff}
.content{padding:16px;max-width:960px;margin:0 auto;width:100%;padding-bottom:48px}
/* CARDS */
.profile-card{background:#1e4d8c;color:#fff;border-radius:14px;padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:12px}
.avatar{width:48px;height:48px;border-radius:50%;background:#2563eb;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex-shrink:0}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:16px;margin-bottom:12px}
.card-title{font-size:11px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
/* LFT */
.lft-bar{border-radius:10px;padding:12px 16px;display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;border-left:4px solid}
.lft-bar.green{background:#f0fdf4;border-color:#4ade80;color:#166534}
.lft-bar.yellow{background:#fefce8;border-color:#facc15;color:#854d0e}
.lft-bar.red{background:#fef2f2;border-color:#f87171;color:#991b1b}
.lft-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px}
.dot-green{background:#22c55e}.dot-yellow{background:#eab308}.dot-red{background:#ef4444}
/* HOURS */
.hours-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:8px}
.hour-btn{padding:12px 4px;border-radius:12px;border:2px solid #e5e7eb;background:#f9fafb;font-weight:700;font-size:13px;cursor:pointer;transition:all .15s;color:#374151}
.hour-btn.selected{background:#1e3a6e;color:#fff;border-color:#1e3a6e;transform:scale(1.05)}
/* ÁRBOL */
.porq-step{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:16px;margin-bottom:12px;border-left:4px solid #3b82f6}
.porq-step.done{border-left-color:#22c55e;background:#f0fdf4}
.step-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.step-num{width:28px;height:28px;border-radius:50%;background:#3b82f6;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step-num.done{background:#22c55e}
.step-title{font-weight:700;font-size:14px;color:#1f2937}
.step-sub{font-size:12px;color:#6b7280;margin-top:1px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:4px}
.opt-btn{padding:10px 12px;border-radius:10px;border:2px solid #e5e7eb;background:#f9fafb;font-size:13px;cursor:pointer;transition:all .15s;color:#374151;text-align:left;font-weight:500}
.opt-btn:hover{border-color:#93c5fd;background:#eff6ff}
.opt-btn.full{grid-column:1/-1}
.answer-disp{background:#eff6ff;border-radius:8px;padding:8px 12px;font-size:13px;color:#1e3a6e;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.change-btn{background:none;border:none;cursor:pointer;font-size:11px;color:#6b7280;text-decoration:underline}
/* CAUSA RESUMEN */
.causa-ok{background:#f0fdf4;border:1px solid #86efac;border-radius:12px;padding:14px;margin-bottom:12px}
.causa-ok-title{font-size:11px;font-weight:700;color:#166534;text-transform:uppercase;margin-bottom:8px}
.causa-row{display:flex;gap:8px;font-size:13px;margin-bottom:4px}
.causa-lbl{color:#6b7280;min-width:110px;flex-shrink:0}
.causa-val{color:#1f2937;font-weight:600}
/* CHIPS */
.chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.chip-ok{background:#dcfce7;color:#166534}
.chip-alerta{background:#fef9c3;color:#854d0e}
.chip-bloqueado,.chip-rechazado{background:#fee2e2;color:#991b1b}
.chip-pendiente{background:#fef9c3;color:#854d0e}
.chip-autorizado{background:#dcfce7;color:#166534}
/* SEMÁFORO */
.sem-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;display:inline-block}
.sd-verde{background:#22c55e;box-shadow:0 0 8px #22c55e}
.sd-amarillo{background:#eab308;box-shadow:0 0 8px #eab308}
.sd-rojo{background:#ef4444;box-shadow:0 0 8px #ef4444}
.sd-negro{background:#111827;box-shadow:0 0 8px #6b7280}
.emp-card{border-radius:14px;padding:16px;border:2px solid;margin-bottom:10px}
.emp-card.verde{background:#f0fdf4;border-color:#22c55e}
.emp-card.amarillo{background:#fefce8;border-color:#eab308}
.emp-card.rojo{background:#fff1f2;border-color:#ef4444}
.emp-card.negro{background:#1f2937;border-color:#111827;color:#fff}
.barra-wrap{background:rgba(0,0,0,.1);border-radius:20px;height:8px;margin:8px 0;overflow:hidden}
.barra{height:8px;border-radius:20px}
.bar-verde{background:#22c55e}.bar-amarillo{background:#eab308}.bar-rojo{background:#ef4444}.bar-negro{background:#fff}
/* INFO */
.info-bar{background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:10px 16px;display:flex;justify-content:space-between;font-size:12px;color:#6b7280;margin-bottom:12px;flex-wrap:wrap;gap:6px}
.alert-orange{background:#fff7ed;border:1px solid #fb923c;border-radius:10px;padding:12px 16px;font-size:13px;color:#9a3412;font-weight:600;margin-bottom:12px}
.alert-blue{background:#eff6ff;border:1px solid #93c5fd;border-radius:10px;padding:12px 16px;font-size:13px;color:#1e3a6e;font-weight:600;margin-bottom:12px}
/* DB */
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.sum-card{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.07);padding:12px;text-align:center}
.sum-icon{font-size:22px}.sum-val{font-size:20px;font-weight:800;color:#1e3a6e}.sum-lbl{font-size:11px;color:#9ca3af;margin-top:2px}
.reg-card{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:16px;margin-bottom:10px}
.reg-causa{font-size:12px;color:#374151;margin-top:6px;background:#f9fafb;border-radius:8px;padding:8px 10px}
.reg-id{font-size:11px;color:#9ca3af;margin-top:4px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
/* LEGEND */
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:#374151}
/* TABLE */
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f9fafb;padding:8px 10px;text-align:left;font-size:11px;color:#6b7280;font-weight:700;text-transform:uppercase;border-bottom:2px solid #e5e7eb}
td{padding:10px;border-bottom:1px solid #f3f4f6;vertical-align:middle}
tr:hover td{background:#f9fafb}
.table-wrap{overflow-x:auto;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
/* SABADO */
.personal-sel{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.personal-tag{display:inline-flex;align-items:center;gap:4px;background:#eff6ff;border:1px solid #93c5fd;border-radius:20px;padding:4px 10px;font-size:12px;color:#1e3a6e;font-weight:600}
.tag-x{background:none;border:none;cursor:pointer;color:#6b7280;font-size:14px;line-height:1;padding:0}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal-box{background:#fff;border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,.3);padding:24px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto}
.modal-title{font-weight:800;font-size:16px;color:#1e3a6e;margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.empty{background:#fff;border-radius:14px;padding:40px 16px;text-align:center;color:#9ca3af}
.hist-toggle{width:100%;background:none;border:none;cursor:pointer;color:#2563eb;font-size:12px;font-weight:600;padding:8px;text-align:center}
@media(max-width:500px){.summary-grid{grid-template-columns:repeat(2,1fr)}.hours-grid{grid-template-columns:repeat(3,1fr)}.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs><radialGradient id="lg" cx="50%" cy="45%" r="55%"><stop offset="0%" stop-color="#29b6f6"/><stop offset="100%" stop-color="#0d47a1"/></radialGradient></defs>
        <ellipse cx="100" cy="100" rx="92" ry="88" fill="url(#lg)"/>
        <path d="M18 135 Q35 115 55 130 Q75 148 95 130 Q115 112 135 130 Q155 148 175 132 Q185 142 182 155 Q160 175 130 180 Q100 185 70 178 Q40 170 20 152 Z" fill="#0d47a1" opacity="0.55"/>
        <text x="100" y="88" text-anchor="middle" font-family="Arial Black,sans-serif" font-weight="900" font-size="58" fill="white" letter-spacing="-1">GPA</text>
        <text x="100" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="20" fill="#bbdefb" letter-spacing="8">AQUA</text>
        <path d="M28 142 Q48 128 68 142 Q88 156 108 142 Q128 128 148 142 Q163 152 178 142" stroke="white" stroke-width="2.5" fill="none" opacity="0.6"/>
      </svg>
    </div>
    <h1>GPA Operaciones</h1>
    <p class="sub">Sistema de Registro de Horas Extras</p>
    <label>Número de empleado</label>
    <input type="text" id="loginNum" placeholder="Ej. 8197" inputmode="numeric" onkeydown="if(event.key==='Enter')doLogin()"/>
    <label>Contraseña</label>
    <div class="pass-wrap">
      <input type="password" id="loginPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/>
      <button class="toggle-pass" onclick="togglePass()">Ver</button>
    </div>
    <div id="loginErr" class="err-msg hidden"></div>
    <br/>
    <button class="btn btn-primary" onclick="doLogin()" id="btnLogin">Iniciar sesión</button>
  </div>
</div>

<!-- APP -->
<div id="appScreen">
  <div class="app-header">
    <div style="display:flex;align-items:center">
      <svg class="header-logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs><radialGradient id="lgh" cx="50%" cy="45%" r="55%"><stop offset="0%" stop-color="#29b6f6"/><stop offset="100%" stop-color="#0d47a1"/></radialGradient></defs>
        <ellipse cx="100" cy="100" rx="92" ry="88" fill="url(#lgh)"/>
        <text x="100" y="88" text-anchor="middle" font-family="Arial Black,sans-serif" font-weight="900" font-size="58" fill="white" letter-spacing="-1">GPA</text>
        <text x="100" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="20" fill="#bbdefb" letter-spacing="8">AQUA</text>
      </svg>
      <div>
        <div class="header-title">GPA Operaciones</div>
        <div class="header-sub" id="headerSub"></div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <div><div class="clock-time" id="clockTime"></div><div class="clock-date" id="clockDate"></div></div>
      <button class="btn-logout" onclick="doLogout()">Salir</button>
    </div>
  </div>
  <div class="tabs hidden" id="tabsBar">
    <button class="tab" id="tabMon" onclick="switchTab('monitor')">📊 Monitor</button>
    <button class="tab" id="tabRegs" onclick="switchTab('registros')">📋 Solicitudes</button>
    <button class="tab" id="tabSab" onclick="switchTab('sabados')">📅 Sábados</button>
    <button class="tab" id="tabUsr" onclick="switchTab('usuarios')">👥 Usuarios</button>
  </div>
  <div class="content" id="mainContent"></div>
</div>

<!-- MODAL USUARIO -->
<div class="modal-overlay hidden" id="modalUsr">
  <div class="modal-box">
    <div class="modal-title" id="modalUsrTitle">Nuevo usuario</div>
    <div class="form-grid">
      <div><label>N° Empleado *</label><input id="fu_num" placeholder="Ej. 1234"/></div>
      <div><label>Contraseña *</label><input id="fu_pass" placeholder="GPA2026"/></div>
      <div style="grid-column:1/-1"><label>Nombre completo *</label><input id="fu_nombre" placeholder="APELLIDO NOMBRE"/></div>
      <div><label>Puesto</label><input id="fu_puesto"/></div>
      <div><label>Ubicación</label><input id="fu_ubicacion"/></div>
      <div><label>Departamento</label><input id="fu_depto"/></div>
      <div><label>Rol *</label>
        <select id="fu_rol">
          <option value="operario">Operario</option>
          <option value="jefe">Jefe</option>
          <option value="gerente">Gerente</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div><label>N° Jefe directo</label><input id="fu_jefe" placeholder="Num emp del jefe"/></div>
      <div><label>N° Gerente autorizador</label><input id="fu_gerente" placeholder="Ej. 8101"/></div>
      <div><label>Email</label><input id="fu_email" type="email"/></div>
      <div><label>Estatus</label>
        <select id="fu_activo"><option value="true">Activo</option><option value="false">Baja</option></select>
      </div>
    </div>
    <div id="modalUsrErr" class="err-msg hidden" style="margin-top:10px"></div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn btn-primary" onclick="guardarUsuario()">Guardar</button>
      <button class="btn" style="background:#f3f4f6;color:#374151" onclick="closeModalUsr()">Cancelar</button>
    </div>
  </div>
</div>

<!-- MODAL SÁBADO -->
<div class="modal-overlay hidden" id="modalSab">
  <div class="modal-box">
    <div class="modal-title">Solicitar Sábado Laborado</div>
    <label>Fecha del sábado *</label>
    <input type="date" id="fs_fecha"/>
    <label style="margin-top:12px">Personal a convocar *</label>
    <div style="display:flex;gap:8px;margin-top:6px">
      <select id="fs_personal_sel" style="flex:1"><option value="">-- Seleccionar empleado --</option></select>
      <button class="btn-xs btn-primary" onclick="agregarPersonal()">+ Agregar</button>
    </div>
    <div class="personal-sel" id="personalSelList"></div>
    <div id="sabArbol" style="margin-top:12px"></div>
    <div id="modalSabErr" class="err-msg hidden" style="margin-top:10px"></div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn btn-primary" onclick="guardarSabado()">Enviar solicitud</button>
      <button class="btn" style="background:#f3f4f6;color:#374151" onclick="closeModalSab()">Cancelar</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
// ESTADO GLOBAL
// ══════════════════════════════════════════════════════════════
let session = null, clockInt = null;
let selectedHoras = '', showHist = false, currentTab = 'monitor';
let cr = {cat:null,p1:null,p2:null,p3:null};
let sabCr = {cat:null,p1:null,p2:null,p3:null};
let personalSel = []; // para sábados
let editingUser = null;
let monitorFiltro = 'todos';

// Cache de datos
let cacheRegistros = [], cacheSabados = [], cacheUsuarios = [], cacheMonitor = [];

// ══════════════════════════════════════════════════════════════
// ÁRBOL 5 PORQUÉS
// ══════════════════════════════════════════════════════════════
const ARBOL = [

const fmt2 = n => String(n).padStart(2,'0');
function getNow(){const d=new Date();return{fecha:`${d.getFullYear()}-${fmt2(d.getMonth()+1)}-${fmt2(d.getDate())}`,hora:`${fmt2(d.getHours())}:${fmt2(d.getMinutes())}:${fmt2(d.getSeconds())}`,ts:d.toISOString()};}
function lftStatus(hd){hd=parseFloat(hd)||0;if(hd>3)return{estado:'bloqueado',msg:'Horas del día superan 3h (Art. 68 LFT)',color:'red'};if(hd>=2.5)return{estado:'alerta',msg:hd+'h — cerca del límite diario (3h máx)',color:'yellow'};return{estado:'ok',msg:hd+'h — dentro del límite diario (3h máx)',color:'green'};}
function semaforo(h){h=parseFloat(h)||0;if(h<=0)return{css:'verde',dot:'sd-verde',bar:'bar-verde',label:'Sin horas'};if(h<=3)return{css:'verde',dot:'sd-verde',bar:'bar-verde',label:'Normal'};if(h<=6)return{css:'amarillo',dot:'sd-amarillo',bar:'bar-amarillo',label:'Precaución'};if(h<=9)return{css:'rojo',dot:'sd-rojo',bar:'bar-rojo',label:'En límite'};return{css:'negro',dot:'sd-negro',bar:'bar-negro',label:'¡Excedido!'};}
const initials = n => n.split(' ').map(w=>w[0]).slice(0,2).join('');
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
async function api(path, method='GET', body=null){
  const opts={method,headers:{'Content-Type':'application/json'}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch('/api/'+path,opts);
  return r.json();
}

function togglePass(){const i=document.getElementById('loginPass'),b=document.querySelector('.toggle-pass');if(i.type==='password'){i.type='text';b.textContent='Ocultar';}else{i.type='password';b.textContent='Ver';}}
async function doLogin(){
  const num=document.getElementById('loginNum').value.trim();
  const pass=document.getElementById('loginPass').value;
  const btn=document.getElementById('btnLogin');
  const err=document.getElementById('loginErr');
  if(!num||!pass){err.textContent='Completa todos los campos.';err.classList.remove('hidden');return;}
  btn.textContent='Verificando...';btn.disabled=true;
  try{
    const r=await api('login','POST',{num_emp:num,password:pass});
    if(!r.ok){err.textContent=r.error||'Credenciales incorrectas';err.classList.remove('hidden');btn.textContent='Iniciar sesión';btn.disabled=false;return;}
    session=r.user;
    err.classList.add('hidden');
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('appScreen').style.display='flex';
    startClock(); renderHeader();
    setupTabs();
  }catch(e){err.textContent='Error de conexión. Verifica tu red.';err.classList.remove('hidden');}
  btn.textContent='Iniciar sesión';btn.disabled=false;
}
function doLogout(){
  session=null;selectedHoras='';cr={cat:null,p1:null,p2:null,p3:null};
  currentTab='monitor';showHist=false;monitorFiltro='todos';
  cacheRegistros=[];cacheSabados=[];cacheUsuarios=[];cacheMonitor=[];
  clearInterval(clockInt);
  document.getElementById('loginNum').value='';document.getElementById('loginPass').value='';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('appScreen').style.display='none';
}
function startClock(){function tick(){const n=getNow();document.getElementById('clockTime').textContent=n.hora;document.getElementById('clockDate').textContent=n.fecha;}tick();clockInt=setInterval(tick,1000);}
function renderHeader(){
  const rl={operario:'Operario',jefe:'Jefe',gerente:'Gerente',admin:'Admin'};
  const rc={operario:'badge-op',jefe:'badge-jefe',gerente:'badge-ger',admin:'badge-admin'};
  document.getElementById('headerSub').innerHTML=`<span>${esc(session.nombre)}</span><span class="badge ${rc[session.rol]}">${rl[session.rol]}</span><span style="color:#bfdbfe;font-size:10px">${esc(session.ubicacion||'')} · ${esc(session.depto||'')}</span>`;
}
function setupTabs(){
  const bar=document.getElementById('tabsBar');
  if(session.rol==='operario'){bar.classList.add('hidden');renderForm();return;}
  bar.classList.remove('hidden');
  // Mostrar/ocultar tabs según rol
  document.getElementById('tabUsr').classList.toggle('hidden', session.rol!=='admin');
  document.getElementById('tabSab').classList.toggle('hidden', session.rol==='operario');
  switchTab('monitor');
}
function switchTab(t){
  currentTab=t;
  ['monitor','registros','sabados','usuarios'].forEach(k=>{
    const el=document.getElementById('tab'+k.charAt(0).toUpperCase()+k.slice(1));
    if(el)el.classList.toggle('active',k===t);
  });
  // Fix IDs
  const map={monitor:'tabMon',registros:'tabRegs',sabados:'tabSab',usuarios:'tabUsr'};
  Object.entries(map).forEach(([k,id])=>{const el=document.getElementById(id);if(el)el.classList.toggle('active',k===t);});
  renderTab();
}
function renderTab(){
  if(currentTab==='monitor')renderMonitor();
  else if(currentTab==='registros')renderRegistros();
  else if(currentTab==='sabados')renderSabados();
  else if(currentTab==='usuarios')renderUsuarios();
}

function renderForm(){
  const misReg=cacheRegistros.filter(r=>r.num_emp===session.num_emp);
  const yaHoy=misReg.some(r=>r.fecha===getNow().fecha);
  const lft=lftStatus(selectedHoras);
  const horasSem=misReg.reduce((s,r)=>{const ini=semanaIni();const d=new Date(r.ts||r.fecha);return d>=ini?s+parseFloat(r.horas_dia||0):s;},0);
  const sem=semaforo(horasSem+(parseFloat(selectedHoras)||0));
  const necesitaGerente=(horasSem+(parseFloat(selectedHoras)||0))>9;
  const valid=!!selectedHoras&&lft.estado!=='bloqueado'&&!yaHoy&&cr.p3!==null&&!necesitaGerente;

  let lftHtml='';
  if(selectedHoras){const dc={green:'dot-green',yellow:'dot-yellow',red:'dot-red'}[lft.color];const tt={ok:'✓ Dentro de límites LFT',alerta:'⚠ Advertencia LFT',bloqueado:'✗ Bloqueado — Art. 68 LFT'}[lft.estado];lftHtml=`<div class="lft-bar ${lft.color}"><div class="lft-dot ${dc}"></div><div><b>${tt}</b><div style="font-size:12px;margin-top:2px">${esc(lft.msg)}</div></div></div>`;}

  const horasHtml=['0.5','1','1.5','2','2.5','3'].map(h=>`<button class="hour-btn${selectedHoras===h?' selected':''}" onclick="selHora('${h}')">${h}h</button>`).join('');
  const arbolHtml=buildArbolHtml('cr',yaHoy);
  const causaTexto=buildCausaTexto('cr');
  let resHtml='';
  if(causaTexto){const parts=causaTexto.split(' › ');const labels=['Categoría','Detalle','¿Por qué?','Causa raíz'];resHtml=`<div class="causa-ok"><div class="causa-ok-title">✅ Causa raíz identificada</div>${parts.map((p,i)=>`<div class="causa-row"><span class="causa-lbl">${labels[i]||''}:</span><span class="causa-val">${esc(p)}</span></div>`).join('')}</div>`;}

  let histHtml='';
  if(misReg.length>0){histHtml=`<button class="hist-toggle" onclick="toggleHist()">${showHist?'▲ Ocultar':'▼ Ver'} mis registros (${misReg.length})</button>`;if(showHist)misReg.forEach(r=>{const s2=semaforo(parseFloat(r.horas_semana||r.horas_dia));histHtml+=`<div class="reg-card"><div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center"><b>${r.horas_dia}h</b><span style="font-size:12px;color:#6b7280">${r.fecha} ${r.hora_registro||''}</span><span class="chip chip-${r.estado_lft}">${(r.estado_lft||'').toUpperCase()}</span><span class="chip chip-${r.estado_final}">${(r.estado_final||'').toUpperCase()}</span></div><div class="reg-causa">${esc(r.causa_texto||r.causa_cat||'')}</div><div class="reg-id">ID: ${r.id}</div></div>`;});}

  const n=getNow();
  const pct=Math.min(((horasSem)/9)*100,100);
  document.getElementById('mainContent').innerHTML=`
    <div class="profile-card"><div class="avatar">${esc(initials(session.nombre))}</div><div><div style="font-weight:800;font-size:15px">${esc(session.nombre)}</div><div style="font-size:12px;color:#93c5fd;margin-top:2px">${esc(session.puesto||'')}</div><div style="font-size:11px;color:#bfdbfe;margin-top:3px">${esc(session.depto||'')} · ${esc(session.ubicacion||'')} · N° ${session.num_emp}</div></div></div>
    <div class="card"><div class="card-title">Acumulado semanal</div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><div class="sem-dot ${sem.dot}"></div><div style="font-size:22px;font-weight:800">${horasSem}h <span style="font-size:13px;font-weight:500;color:#6b7280">/ 9h máx</span></div><span class="chip chip-${sem.css==='verde'?'ok':sem.css==='amarillo'?'alerta':'bloqueado'}">${sem.label}</span></div>
      <div class="barra-wrap"><div class="barra ${sem.bar}" style="width:${pct}%"></div></div>
      ${necesitaGerente&&selectedHoras?`<div class="alert-orange" style="margin-top:8px;margin-bottom:0">⚠ Con estas horas superarías las 9h semanales. La solicitud irá al <strong>${esc(session.gerente_nombre||'Gerente')}</strong> para autorización especial.</div>`:''}
    </div>
    ${lftHtml}
    <div class="card"><div class="card-title">¿Cuántas horas extra trabajaste hoy?</div><div class="hours-grid">${horasHtml}</div></div>
    ${arbolHtml}
    ${resHtml}
    <div class="info-bar"><span>📅 ${n.fecha} &nbsp;🕐 ${n.hora}</span><span>Jefe: ${esc(session.jefe_nombre||'—')}</span>${session.gerente_nombre?`<span>Gerente: ${esc(session.gerente_nombre)}</span>`:''}</div>
    ${yaHoy?`<div class="alert-orange">⚠ Ya registraste tus horas extra hoy. Solo se permite un registro por día.</div>`:''}
    <button class="btn btn-primary" onclick="guardarHoras()" ${valid?'':'disabled'} style="margin-bottom:12px">
      ${necesitaGerente&&selectedHoras?'Enviar a Gerente para autorización':'Enviar solicitud'}

  ;

  if(cacheRegistros.length===0) loadRegistros();
}

function renderJefePanel(){
  return `<div class="card"><div class="card-title">Acciones de jefe</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-primary btn-sm" onclick="switchTab('monitor')">📊 Ver monitor de mi equipo</button>
      <button class="btn btn-primary btn-sm" onclick="switchTab('registros')">📋 Ver solicitudes pendientes</button>
      <button class="btn btn-orange btn-sm" onclick="abrirModalSab()">📅 Solicitar Sábado Laborado</button>

  </div>`;
}

async function loadRegistros(){
  try{
    const r=await api(`registros?num_emp=${session.num_emp}&rol=${session.rol}&ubicacion=${encodeURIComponent(session.ubicacion||'')}`);
    if(r.ok){cacheRegistros=r.data;if(session.rol==='operario'||session.rol==='jefe')renderForm();}
  }catch(e){console.error(e);}
}

function selHora(h){selectedHoras=h;renderForm();}
function toggleHist(){showHist=!showHist;renderForm();}

async function guardarHoras(){
  const lft=lftStatus(selectedHoras);
  if(!selectedHoras||lft.estado==='bloqueado'||!cr.p3)return;
  const horasSem=cacheRegistros.filter(r=>r.num_emp===session.num_emp).reduce((s,r)=>{const d=new Date(r.ts||r.fecha);return d>=semanaIni()?s+parseFloat(r.horas_dia||0):s;},0);
  const nuevasSem=horasSem+parseFloat(selectedHoras);
  const nodo=ARBOL.find(a=>a.id===cr.cat);
  const causaTexto=buildCausaTexto('cr');
  try{
    const r=await api('registros','POST',{
      num_emp:session.num_emp,nombre:session.nombre,puesto:session.puesto,
      ubicacion:session.ubicacion,depto:session.depto,
      horas_dia:parseFloat(selectedHoras),horas_semana:nuevasSem,
      causa_cat:nodo?.label||cr.cat,causa_p1:cr.p1,causa_p2:cr.p2,causa_p3:cr.p3,
      causa_texto:causaTexto,estado_lft:lft.estado,
      jefe_num:session.jefe_num,gerente_num:session.gerente_num
    });
    if(r.ok){
      alert(`✅ Solicitud registrada correctamente.\nID: ${r.data.id}\n${nuevasSem>9?'⚠ Enviada al Gerente para autorización especial.':'Pendiente de autorización de tu jefe.'}`);
      selectedHoras='';cr={cat:null,p1:null,p2:null,p3:null};
      await loadRegistros();
    } else alert('❌ '+r.error);

}
function buildArbolHtml(key, disabled){
  if(disabled)return'';
  const c=key==='cr'?cr:sabCr;

  const nodo=c.cat?ARBOL.find(a=>a.id===c.cat):null;

  else{html+=`<div class="opts">`;ARBOL.forEach(a=>{html+=`<button class="opt-btn" onclick="${setFn}('${a.id}')">${a.label}</button>`;});html+=`</div>`;}
  html+=`</div>`;if(!c.cat)return html;

  else{html+=`<div style="display:flex;gap:8px;margin-top:4px"><input type="${nodo.p1t}" id="p1inp_${key}" placeholder="${esc(nodo.p1ph||'')}" ${nodo.p1t==='number'?'min="1"':''} style="flex:1"/><button class="btn btn-primary btn-sm" onclick="setP1inp('${key}')">OK</button></div>`;}
  html+=`</div>`;if(c.p1===null)return html;

  html+=`<div class="porq-step${c.p2!==null?' done':''}"><div class="step-header"><div class="step-num${c.p2!==null?' done':''}">3</div><div><div class="step-title">${esc(nodo.p2)}</div><div class="step-sub">Primer ¿por qué?</div></div></div>`;
  if(c.p2!==null){html+=`<div class="answer-disp">${esc(c.p2)}<button class="change-btn" onclick="resetCr(2,'${key}')">Cambiar</button></div>`;}
  else{html+=`<div class="opts">`;nodo.p2ops.forEach(o=>{html+=`<button class="opt-btn full" onclick="setP2('${o.replace(/'/g,"\\'")}','${key}')">→ ${o}</button>`;});html+=`</div>`;}
  html+=`</div>`;if(c.p2===null)return html;

  const p3ops=nodo.p3ops[c.p2]||[];
  html+=`<div class="porq-step${c.p3!==null?' done':''}"><div class="step-header"><div class="step-num${c.p3!==null?' done':''}">4</div><div><div class="step-title">¿Por qué ocurrió "${esc(c.p2)}"?</div><div class="step-sub">Causa raíz</div></div></div>`;
  if(c.p3!==null){html+=`<div class="answer-disp">${esc(c.p3)}<button class="change-btn" onclick="resetCr(3,'${key}')">Cambiar</button></div>`;}
  else{html+=`<div class="opts">`;p3ops.forEach(o=>{html+=`<button class="opt-btn full" onclick="setP3('${o.replace(/'/g,"\\'")}','${key}')">🔍 ${o}</button>`;});html+=`</div>`;}
  html+=`</div>`;return html;
}

function setCat(id){cr={cat:id,p1:null,p2:null,p3:null};renderForm();}
function setSabCat(id){sabCr={cat:id,p1:null,p2:null,p3:null};renderSabModal();}
function setP1(v,key){if(key==='cr'){cr.p1=v;cr.p2=null;cr.p3=null;renderForm();}else{sabCr.p1=v;sabCr.p2=null;sabCr.p3=null;renderSabModal();}}
function setP1inp(key){const i=document.getElementById('p1inp_'+key);if(i&&i.value.trim())setP1(i.value.trim(),key);}
function setP2(v,key){if(key==='cr'){cr.p2=v;cr.p3=null;renderForm();}else{sabCr.p2=v;sabCr.p3=null;renderSabModal();}}
function setP3(v,key){if(key==='cr'){cr.p3=v;renderForm();}else{sabCr.p3=v;renderSabModal();}}
function resetCr(n,key){const c=key==='cr'?cr:sabCr;if(n===0){c.cat=null;c.p1=null;c.p2=null;c.p3=null;}else if(n===1){c.p1=null;c.p2=null;c.p3=null;}else if(n===2){c.p2=null;c.p3=null;}else c.p3=null;if(key==='cr')renderForm();else renderSabModal();}

async function authAllPendiente(num_emp, dec){
  const pendientes=cacheRegistros.filter(r=>r.num_emp===num_emp&&r.auth_gerente==='pendiente');

}

function exportCSV(){
  const h=['ID','Fecha','Hora','Nombre','N° Emp','Puesto','Área','Sucursal','Horas día','Acum. semana','Semáforo','Categoría','¿Por qué?','Causa raíz','Estado LFT','Auth Jefe','Auth Gerente','Estado final'];
  const rows=cacheRegistros.map(r=>{const s=semaforo(r.horas_semana||r.horas_dia);return[r.id,r.fecha,r.hora_registro,r.nombre,r.num_emp,r.puesto,r.depto,r.ubicacion,r.horas_dia,r.horas_semana,s.label,r.causa_cat,r.causa_p2,r.causa_p3,r.estado_lft,r.auth_jefe,r.auth_gerente,r.estado_final];});
  const csv=[h,...rows].map(r=>r.map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`horas_extras_${getNow().fecha}.csv`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

  sel.innerHTML='<option value="">-- Seleccionar empleado --</option>';
  cacheMonitor.forEach(e=>{sel.innerHTML+=`<option value="${e.num_emp}" data-nombre="${esc(e.nombre)}">${e.nombre} (${e.num_emp})</option>`;});
  document.getElementById('personalSelList').innerHTML='';
  document.getElementById('fs_fecha').value='';
  renderSabModal();
  document.getElementById('modalSab').classList.remove('hidden');
}
function renderSabModal(){
  document.getElementById('sabArbol').innerHTML=buildArbolHtml('sabCr',false);
}
function agregarPersonal(){
  const sel=document.getElementById('fs_personal_sel');
  if(!sel.value)return;
  const nombre=sel.options[sel.selectedIndex].dataset.nombre;
  if(personalSel.find(p=>p.num_emp===sel.value))return;
  personalSel.push({num_emp:sel.value,nombre});
  sel.value='';
  const list=document.getElementById('personalSelList');
  list.innerHTML=personalSel.map(p=>`<div class="personal-tag">${esc(p.nombre)}<button class="tag-x" onclick="quitarPersonal('${p.num_emp}')">✕</button></div>`).join('');
}
function quitarPersonal(num){personalSel=personalSel.filter(p=>p.num_emp!==num);document.getElementById('personalSelList').innerHTML=personalSel.map(p=>`<div class="personal-tag">${esc(p.nombre)}<button class="tag-x" onclick="quitarPersonal('${p.num_emp}')">✕</button></div>`).join('');}
function closeModalSab(){document.getElementById('modalSab').classList.add('hidden');}
async function guardarSabado(){
  const fecha=document.getElementById('fs_fecha').value;
  const err=document.getElementById('modalSabErr');
  if(!fecha){err.textContent='Selecciona la fecha del sábado.';err.classList.remove('hidden');return;}
  if(personalSel.length===0){err.textContent='Agrega al menos un empleado.';err.classList.remove('hidden');return;}
  if(!sabCr.p3){err.textContent='Completa el análisis de causa raíz.';err.classList.remove('hidden');return;}
  err.classList.add('hidden');
  const nd=ARBOL.find(a=>a.id===sabCr.cat);
  const r=await api('sabados','POST',{
    fecha_sabado:fecha,jefe_num:session.num_emp,jefe_nombre:session.nombre,
    ubicacion:session.ubicacion,depto:session.depto,personal:personalSel,
    causa_cat:nd?.label||sabCr.cat,causa_p1:sabCr.p1,causa_p2:sabCr.p2,
    causa_p3:sabCr.p3,causa_texto:buildCausaTexto('sabCr'),
    gerente_num:session.gerente_num
  });
  if(r.ok){closeModalSab();alert('✅ Solicitud de sábado enviada al Gerente para autorización.');renderSabados();}
  else{err.textContent='Error: '+r.error;err.classList.remove('hidden');}
}

// ══════════════════════════════════════════════════════════════
// USUARIOS — solo admin
// ══════════════════════════════════════════════════════════════
async function renderUsuarios(){
  const r=await api('usuarios');
  cacheUsuarios=r.ok?r.data:[];
  let html=`<button class="btn btn-primary" style="margin-bottom:14px;width:auto;padding:10px 20px;border-radius:12px" onclick="abrirModalUsr(null)">+ Nuevo usuario</button>`;
  html+=`<div class="table-wrap"><table><thead><tr><th>N° Emp</th><th>Nombre</th><th>Puesto</th><th>Sucursal</th><th>Depto</th><th>Rol</th><th>Estatus</th><th>Acciones</th></tr></thead><tbody>`;
  cacheUsuarios.forEach(u=>{
    const rolColor={operario:'badge-op',jefe:'badge-jefe',gerente:'badge-ger',admin:'badge-admin'}[u.rol]||'badge-admin';
    html+=`<tr>
      <td style="font-weight:700">${u.num_emp}</td>
      <td>${esc(u.nombre)}</td>
      <td style="font-size:12px">${esc(u.puesto||'')}</td>
      <td style="font-size:12px">${esc(u.ubicacion||'')}</td>
      <td style="font-size:12px">${esc(u.depto||'')}</td>
      <td><span class="badge ${rolColor}">${u.rol}</span></td>
      <td><span class="chip ${u.activo?'chip-ok':'chip-rechazado'}">${u.activo?'ACTIVO':'BAJA'}</span></td>
      <td style="white-space:nowrap">
        <button class="btn-xs" style="background:#eff6ff;color:#1e3a6e;border:1px solid #93c5fd;margin-right:4px" onclick="abrirModalUsr('${u.num_emp}')">✏ Editar</button>
        <button class="btn-xs" style="background:#fef2f2;color:#dc2626;border:1px solid #fca5a5" onclick="toggleBaja('${u.num_emp}',${u.activo})">${u.activo?'Dar baja':'Reactivar'}</button>
      </td>
    </tr>`;
  });
  html+=`</tbody></table></div>`;
  document.getElementById('mainContent').innerHTML=html;
}

function abrirModalUsr(num_emp){
  editingUser=num_emp;
  const u=num_emp?cacheUsuarios.find(x=>x.num_emp===num_emp):null;
  document.getElementById('modalUsrTitle').textContent=num_emp?'Editar usuario':'Nuevo usuario';
  document.getElementById('fu_num').value=u?.num_emp||'';document.getElementById('fu_num').disabled=!!num_emp;
  document.getElementById('fu_pass').value='';
  document.getElementById('fu_nombre').value=u?.nombre||'';
  document.getElementById('fu_puesto').value=u?.puesto||'';
  document.getElementById('fu_ubicacion').value=u?.ubicacion||'';
  document.getElementById('fu_depto').value=u?.depto||'';
  document.getElementById('fu_rol').value=u?.rol||'operario';
  document.getElementById('fu_jefe').value=u?.jefe_num||'';
  document.getElementById('fu_gerente').value=u?.gerente_num||'';
  document.getElementById('fu_email').value=u?.email||'';
  document.getElementById('fu_activo').value=String(u?.activo!==false);
  document.getElementById('modalUsrErr').classList.add('hidden');
  document.getElementById('modalUsr').classList.remove('hidden');
}
function closeModalUsr(){document.getElementById('modalUsr').classList.add('hidden');}
async function guardarUsuario(){
  const err=document.getElementById('modalUsrErr');
  const body={
    num_emp:document.getElementById('fu_num').value.trim(),
    password:document.getElementById('fu_pass').value||undefined,
    nombre:document.getElementById('fu_nombre').value.trim(),
    puesto:document.getElementById('fu_puesto').value.trim(),
    ubicacion:document.getElementById('fu_ubicacion').value.trim(),
    depto:document.getElementById('fu_depto').value.trim(),
    rol:document.getElementById('fu_rol').value,
    jefe_num:document.getElementById('fu_jefe').value.trim()||null,
    gerente_num:document.getElementById('fu_gerente').value.trim()||null,
    email:document.getElementById('fu_email').value.trim()||null,
    activo:document.getElementById('fu_activo').value==='true',
  };
  if(!body.num_emp||!body.nombre){err.textContent='N° empleado y nombre son obligatorios.';err.classList.remove('hidden');return;}
  err.classList.add('hidden');
  const r=editingUser
    ?await api('usuarios','PUT',body)
    :await api('usuarios','POST',body);
  if(r.ok){closeModalUsr();renderUsuarios();}
  else{err.textContent='Error: '+r.error;err.classList.remove('hidden');}
}
async function toggleBaja(num_emp,activo){
  if(!confirm(activo?`¿Dar de baja a este usuario?`:`¿Reactivar a este usuario?`))return;
  await api('usuarios','PUT',{num_emp,activo:!activo});
  renderUsuarios();
}
